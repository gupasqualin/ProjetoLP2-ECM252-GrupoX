# Parte 1: Deployments e Services dos microsservicos do backend.
# A imagem deve ser criada antes com:
# docker build -t valuation-backend:1.0.0 .

apiVersion: v1
kind: Namespace
metadata:
  name: valuation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: barramento-eventos
  namespace: valuation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: barramento-eventos
  template:
    metadata:
      labels:
        app: barramento-eventos
    spec:
      containers:
        - name: barramento-eventos
          image: valuation-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "barramento-eventos/src/server_barramento-eventos.js"]
          ports:
            - containerPort: 3006
          env:
            - name: PORT
              value: "3006"
            - name: VALUATION_ENGINE_EVENTS_URL
              value: http://valuation:3004/events
---
apiVersion: v1
kind: Service
metadata:
  name: barramento-eventos
  namespace: valuation
spec:
  selector:
    app: barramento-eventos
  ports:
    - port: 3006
      targetPort: 3006
      nodePort: 30006
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestao-empresas
  namespace: valuation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestao-empresas
  template:
    metadata:
      labels:
        app: gestao-empresas
    spec:
      containers:
        - name: gestao-empresas
          image: valuation-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "gestao-empresas/src/server_gestao-empresas.js"]
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: EVENT_BUS_URL
              value: http://barramento-eventos:3006
---
apiVersion: v1
kind: Service
metadata:
  name: gestao-empresas
  namespace: valuation
spec:
  selector:
    app: gestao-empresas
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dados-mercado
  namespace: valuation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dados-mercado
  template:
    metadata:
      labels:
        app: dados-mercado
    spec:
      containers:
        - name: dados-mercado
          image: valuation-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "dados-mercado/src/server_dados-mercado.js"]
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: EVENT_BUS_URL
              value: http://barramento-eventos:3006
---
apiVersion: v1
kind: Service
metadata:
  name: dados-mercado
  namespace: valuation
spec:
  selector:
    app: dados-mercado
  ports:
    - port: 3002
      targetPort: 3002
      nodePort: 30002
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: premissas-projecao
  namespace: valuation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: premissas-projecao
  template:
    metadata:
      labels:
        app: premissas-projecao
    spec:
      containers:
        - name: premissas-projecao
          image: valuation-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "premissas-projecao/src/server_premissas-projecao.js"]
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: EVENT_BUS_URL
              value: http://barramento-eventos:3006
            - name: MARKET_DATA_URL
              value: http://dados-mercado:3002
            - name: DEFAULT_RISK_FREE_RATE
              value: "0.045"
            - name: DEFAULT_MARKET_RISK_PREMIUM
              value: "0.055"
---
apiVersion: v1
kind: Service
metadata:
  name: premissas-projecao
  namespace: valuation
spec:
  selector:
    app: premissas-projecao
  ports:
    - port: 3003
      targetPort: 3003
      nodePort: 30003
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valuation
  namespace: valuation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valuation
  template:
    metadata:
      labels:
        app: valuation
    spec:
      containers:
        - name: valuation
          image: valuation-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "valuation/src/server_valuation.js"]
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: COMPANY_SERVICE_URL
              value: http://gestao-empresas:3001
            - name: MARKET_DATA_SERVICE_URL
              value: http://dados-mercado:3002
            - name: ASSUMPTIONS_SERVICE_URL
              value: http://premissas-projecao:3003
            - name: DEFAULT_RISK_FREE_RATE
              value: "0.045"
            - name: DEFAULT_MARKET_RISK_PREMIUM
              value: "0.055"
---
apiVersion: v1
kind: Service
metadata:
  name: valuation
  namespace: valuation
spec:
  selector:
    app: valuation
  ports:
    - port: 3004
      targetPort: 3004
      nodePort: 30004
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analise-sensibilidade
  namespace: valuation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analise-sensibilidade
  template:
    metadata:
      labels:
        app: analise-sensibilidade
    spec:
      containers:
        - name: analise-sensibilidade
          image: valuation-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "análise-sensibilidade/src/server_sensitivity-matrix.js"]
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              value: "3005"
            - name: VALUATION_ENGINE_URL
              value: http://valuation:3004
apiVersion: v1
kind: Service
metadata:
  name: analise-sensibilidade
  namespace: valuation
spec:
  selector:
    app: analise-sensibilidade
  ports:
    - port: 3005
      targetPort: 3005
      nodePort: 30005
  type: NodePort
